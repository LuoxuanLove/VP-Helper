name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Audit repository boundaries
        run: python tools/check_repository.py
      - name: Test core and presentation logic offline
        run: dotnet test tests/VPHelper.Core.Tests/VPHelper.Core.Tests.csproj -c Release --filter "Category!=Live" --logger trx --results-directory TestResults
      - name: Build Windows x64 shell
        run: dotnet build src/VPHelper.WinUI/VPHelper.WinUI.csproj -c Release -p:Platform=x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
