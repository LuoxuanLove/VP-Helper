name: Draft Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test and package committed source
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./tools/Publish-Portable.ps1 -Version $version
      - name: Create draft with verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $releaseRoot = Join-Path 'artifacts/releases' $version
          $assets = @(
            (Join-Path $releaseRoot "VPHelper-$version-win-x64.zip"),
            (Join-Path $releaseRoot "VPHelper-$version-source.zip"),
            (Join-Path $releaseRoot 'SHA256SUMS.txt')
          )
          $options = @('release', 'create', $env:RELEASE_TAG, '--draft', '--verify-tag', '--generate-notes', '--title', "VP Helper $version")
          if ($version.Contains('-')) { $options += '--prerelease' }
          & gh @options @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-test-results
          path: artifacts/releases/**/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14
